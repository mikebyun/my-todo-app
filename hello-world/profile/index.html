<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩 지정 -->
  <meta charset="UTF-8">
  <!-- 모바일 화면 너비에 맞춰 표시 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 브라우저 탭에 표시되는 제목 -->
  <title>변승현 | 자기소개</title>
  <!-- 페이지 스타일 (색상 테마는 style.css의 :root 변수에서 관리) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 화면 중앙에 배치되는 프로필 카드 -->
  <main class="card">
    <!-- 프로필 아바타 (이모지) -->
    <div class="avatar">👨‍💻</div>
    <!-- 이름 -->
    <h1 class="name">변승현</h1>
    <!-- 직업 -->
    <p class="job">프론트엔드 개발자</p>

    <!-- 기본 정보와 취미 영역을 나누는 구분선 -->
    <hr class="divider">

    <!-- 취미 목록 (각 항목은 태그 모양으로 표시됨) -->
    <section class="hobbies">
      <h2>취미</h2>
      <ul>
        <li>🎬 영화감상</li>
        <li>💻 코딩</li>
        <li>✈️ 여행</li>
      </ul>
    </section>
  </main>

  <!-- 페이지 동작 스크립트 (로드 후 initApp 실행) -->
  <script src="main.js"></script>
</body>
</html>
